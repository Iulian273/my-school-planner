#startupSplash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,color-mix(in srgb,var(--accent,#8b9cff) 17%,var(--bg,#0b0e14)) 0%,var(--bg,#0b0e14) 58%);opacity:1;visibility:visible;transition:opacity .55s ease,visibility .55s ease}

#startupSplash .splash-title{position:relative;z-index:1;font-size:25px;font-weight:850;letter-spacing:5px;text-transform:uppercase;color:var(--text,#f4f6fb);opacity:0;transform:translateY(13px);animation:titleReveal .7s cubic-bezier(.2,.8,.2,1) 1.12s forwards;text-shadow:0 0 22px color-mix(in srgb,var(--accent,#8b9cff) 30%,transparent)}
#startupSplash .splash-line{position:relative;z-index:1;width:0;height:2px;border-radius:3px;background:var(--accent,#8b9cff);box-shadow:0 0 12px var(--accent,#8b9cff);animation:lineReveal .55s ease 1.35s forwards}

@keyframes drawMark{to{stroke-dashoffset:0}} @keyframes drawStem{to{stroke-dashoffset:0}}
@keyframes sparkPop{0%{opacity:0;transform:scale(.2)}65%{opacity:1;transform:scale(1.5)}100%{opacity:.9;transform:scale(1)}}

function calendarHTML(){const y=calDate.getFullYear(),m=calDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,count=new Date(y,m+1,0).getDate(),marked=new Set([...events.map(x=>x.date),...tasks.filter(x=>x.due).map(x=>x.due)]);let cells='';for(let i=0;i<start;i++)cells+=`<div class="calday other"></div>`;for(let d=1;d<=count;d++){const iso=`${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,today=iso===new Date().toISOString().slice(0,10);cells+=`<div class="calday ${today?'today':''} ${marked.has(iso)?'marked':''}">${d}</div>`}return `<div class="row"><button class="btn secondary" onclick="calDate.setMonth(calDate.getMonth()-1);render()">‹</button><b>${calDate.toLocaleDateString(prefs.lang,{month:'long',year:'numeric'})}</b><button class="btn secondary" onclick="calDate.setMonth(calDate.getMonth()+1);render()">›</button></div><div class="calendar" style="margin-top:10px">${['L','Ma','Mi','J','V','S','D'].map(x=>`<div class="calhead">${x}</div>`).join('')}${cells}</div>`}
function del(key,i){if(!confirm(t('confirmDelete')))return;({events,tasks,grades}[key]).splice(i,1);save();render()};function removeLesson(i){const day=days()[selectedDay];schedule[day].splice(i,1);save();render()};function toggleTask(i){tasks[i].done=!tasks[i].done;save();render()}
function exportData(){const data={version:3,schedule,events,tasks,grades,prefs};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.href=url;a.download='my-school-planner-backup.json';a.click();URL.revokeObjectURL(url)}
function importData(e){const file=e.target.files[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!confirm(t('restore')))return;schedule=d.schedule||{};events=d.events||[];tasks=d.tasks||[];grades=d.grades||[];prefs={...prefs,...(d.prefs||{})};save();shell()}catch{alert('Invalid backup file')}};r.readAsText(file)}
const sent=get('msp_notif_sent',{});
function localISO(offset=0){const d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function sendReminder(key,title,body){if(!('Notification'in window)||Notification.permission!=='granted'||sent[key])return;try{new Notification(title,{body,icon:'icon-192.png',tag:key});sent[key]=true;put('msp_notif_sent',sent)}catch(e){}}
function checkReminders(){const n=prefs.notifications||{};if(!('Notification'in window)||Notification.permission!=='granted')return;const today=localISO();if(n.events!==false){events.forEach((e,i)=>{if(e.date===localISO(1))sendReminder(`event-${i}-${e.date}`,nt('notifTest'),`${e.subject} · ${fmt(e.date)}`)})}tasks.forEach((task,i)=>{if(!task.done&&task.due){if(n.homeworkDue!==false&&task.due===today)sendReminder(`due-${i}-${task.due}`,nt('notifHomeworkTitle'),task.title);if(n.overdue!==false&&task.due<today)sendReminder(`overdue-${i}-${task.due}`,nt('notifOverdueTitle'),task.title)}})}

if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});shell();
// Show the startup animation briefly on each app launch, then reveal the planner.
(()=>{const splash=document.getElementById('startupSplash');if(!splash)return;const dismiss=()=>splash.classList.add('is-hidden');window.setTimeout(dismiss,2600);})();

</script></body></html>
